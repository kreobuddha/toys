services:
  web:
    build:
      context: .
    image: toys-web:local
    ports:
      - '8081:80'
    environment:
      # Where this container reaches the backend. On a server the two run side by side and
      # this becomes the backend's service name, for example http://api:8080.
      API_URL: '${API_URL:-http://host.docker.internal:8080}'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
